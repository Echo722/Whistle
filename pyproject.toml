[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "audiosearch-tool"
version = "0.1.1"
description = "Local sound-effect search: shared contracts and development foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "mutagen>=1.47,<2",
    "pydantic>=2.10,<3",
    "uvicorn>=0.36,<1",
]

[project.scripts]
audiosearch = "audiosearch.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx2>=2,<3", "ruff>=0.9,<1"]
desktop = ["PySide6-Essentials>=6.8,<7"]
# Local audition: decode on the desktop and play to the OS output device. Kept
# out of `ai` so the desktop does not drag torch/transformers in just to hear a
# file; kept out of `desktop` so a headless install stays light.
playback = [
    "av>=14,<17",
    "numpy>=2.1,<3",
    "pedalboard>=0.9.26",
    "sounddevice>=0.5,<1",
    "soundfile>=0.13,<1",
]
packaging = ["pyinstaller>=6.12,<7"]
# Local search stack: numpy for decoding/vectors, torch+CUDA, transformers (Qwen3)
# and open-clip-torch (CLAP2). Models are private local caches, never packaged.
ai = [
    "numpy>=2.1,<3",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers>=5.0,<6",
    "open-clip-torch>=4.2,<5",
    "soxr>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audiosearch"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/tools", "/docs/contracts", "/README.md", "/AGENTS.md",
    "/pyproject.toml", "/uv.lock", "/.python-version",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra"
cache_dir = ".local/cache/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = ".local/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Windows CUDA wheels are not on PyPI: pin an explicit, documented source so the
# same build can be reproduced instead of resolving whatever a mirror happens to
# carry. `explicit = true` keeps this index out of every other package's lookup.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[tool.uv]
default-groups = ["dev"]
